[[mods]]
modId="aozaink_auth_client"
version="${mod_version}"
displayName="Molu Auth Client"
authors="${mod_authors}"
description='''Client-side companion of Molu Auth. Shows the in-game login status, opens the portal verification page in the browser, and listens on a loopback callback for instant feedback. Inert on servers without Molu Auth.'''
displayTest="IGNORE_SERVER_VERSION"

