modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL=""

[[mods]]
modId="aozaink_core"
version="${mod_version}"
displayName="Aozai Ink Core"
authors="${mod_authors}"
description='''Handwriting recognition foundation for Minecraft NeoForge. Normalized ink traces, image/trajectory recognition, recognition events, and API integration. Does not define input methods or gameplay.'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.aozaink_core]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.aozaink_core]]
modId="minecraft"
type="required"
versionRange="${compatible_minecraft_versions}"
ordering="NONE"
side="BOTH"

[[mods]]
modId="aozaink_input"
version="${mod_version}"
displayName="Aozai Ink Input"
authors="${mod_authors}"
description='''Classic Taiji (yinyang) writing plane input for Aozai Ink Core. Provides ink staff items and the circular writing plane for handwriting Chinese characters.'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.aozaink_input]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.aozaink_input]]
modId="minecraft"
type="required"
versionRange="${compatible_minecraft_versions}"
ordering="NONE"
side="BOTH"

[[dependencies.aozaink_input]]
modId="aozaink_core"
type="required"
versionRange="${mod_version}"
ordering="AFTER"
side="BOTH"

[[mods]]
modId="aozaink_sigillum"
version="${mod_version}"
displayName="Aozai Sigillum"
authors="${mod_authors}"
description='''Talisman gameplay built on Aozai Ink Core. Write seals to suppress the undead, ward locations, craft talisman papers, and master brush magic.'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.aozaink_sigillum]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.aozaink_sigillum]]
modId="minecraft"
type="required"
versionRange="${compatible_minecraft_versions}"
ordering="NONE"
side="BOTH"

[[dependencies.aozaink_sigillum]]
modId="aozaink_core"
type="required"
versionRange="${mod_version}"
ordering="AFTER"
side="BOTH"
